<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B192C">
<link rel="icon" type="image/svg+xml" href="/assets/logo-icon.svg">
<title>已收到您的電費健檢申請｜能溢有限公司</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#0B192C;color:#cbd5e1;font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.75;padding:24px}
main{max-width:520px;text-align:center}
.ok{width:64px;height:64px;border-radius:50%;background:#00C853;display:grid;place-items:center;margin:0 auto 24px}
h1{color:#fff;font-size:28px;font-weight:900;margin:0 0 12px}
a{display:inline-block;margin-top:28px;background:#F59E0B;color:#1f1300;font-weight:700;padding:12px 22px;border-radius:10px;text-decoration:none}
a.line{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.5);margin-left:8px}

html{-webkit-tap-highlight-color:transparent}
button,.btn{touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform 140ms cubic-bezier(0.23,1,0.32,1)}
button:active,.btn:active{transform:scale(0.97)}

/* ---- 能溢品牌視覺（冷調科技）覆寫 ---- */
:root{--navy:#0B192C;--navy-2:#1E293B;--navy-3:#081221;--green:#00875A;--green-soft:#E6F4EE;--amber:#00875A;--bg:#F4F7F9;--ink-strong:#0B192C}
.btn-amber{background:#00875A;color:#fff}
.mbar .u{background:#00875A!important;color:#fff!important}
:focus-visible{outline-color:#00875A}
.hero h1 .cut,.hero-tag,.pf b.good,.formula .eq b,.crumb{color:#00C853}
.hero-tag{border-color:rgba(0,200,83,.45)}
.seg-you{background:#00C853;color:#04230f}
.money-points div{border-left-color:#00C853}
.hero,.money,.apply,.calc-out,.dash-sec,.apply2{position:relative}
.hero::after,.apply::after,.apply2::after{content:"";position:absolute;right:-160px;top:-180px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(0,191,165,.08),transparent 65%);pointer-events:none}
.hero>.wrap,.apply>.wrap,.apply2>.wrap{position:relative;z-index:1}
h1,h2,h3{letter-spacing:0;word-break:keep-all;overflow-wrap:anywhere}
@media (hover:hover) and (pointer:fine){.btn-amber:hover{background:#00704A;filter:none}}
</style>
<link rel="stylesheet" href="assets/motion.css">
</head>
<body>
<main>
  <div class="ok"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#06281b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
  <h1>已收到您的電費健檢申請</h1>
  <p>能源工程師會在 48 小時內完成初步診斷，並以電話與您聯繫。若有急件，歡迎直接來電 0975-463-123。</p>
  <a href="/">回到首頁</a><a class="line" href="tel:0975463123">撥打 0975-463-123</a>
</main>
<script src="assets/motion.js"></script>
</body>
</html>
