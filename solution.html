const page=document.getElementById('page'), tabs=document.getElementById('tabs');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
tabs.innerHTML=IND.map(d=>`<a href="#${d.id}">${esc(d.name)}</a>`).join('');

/* 示意曲線（戰情室） */
const spark=()=>{const a=[55,52,50,52,58,66,74,80,84,82,78,80,83,86,84,78,70,64,60,58];const W=600,H=150,mx=100;
  const pts=a.map((v,i)=>`${(i/(a.length-1)*W).toFixed(1)},${(H-v/mx*H).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${W}" y1="${H-90/mx*H}" y2="${H-90/mx*H}" stroke="#fff" stroke-dasharray="6 5" stroke-width="1.5" opacity=".7"/><polyline points="0,${H} ${pts} ${W},${H}" fill="rgba(16,185,129,.15)" stroke="none"/><polyline points="${pts}" fill="none" stroke="#10B981" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;};

function render(){
  const id=location.hash.slice(1), d=IND.find(x=>x.id===id)||IND[0];
  tabs.querySelectorAll('a').forEach(a=>a.toggleAttribute('aria-current',a.getAttribute('href')==='#'+d.id));
  document.title=`${d.name}節能解決方案｜能溢有限公司`;
  page.innerHTML=`
  <header class="hero"><div class="wrap"><div class="hero-grid">
    <div>
      <p class="crumb">產業解決方案・${esc(d.name)}</p>
      <h1>${esc(d.h1).replace('\n','<br>')}</h1>
      <p class="sub">${esc(d.sub)}</p>
      <div class="ctas"><a class="btn btn-amber" href="index.html#apply">預約 0 元專案資格評估</a><a class="btn btn-line" href="#arch">看系統怎麼運作</a></div>
    </div>
    <div class="facts">${d.facts.map(f=>`<div class="fact"><b class="num">${esc(f[0])}</b><span>${esc(f[1])}</span></div>`).join('')}</div>
  </div></div></header>

  <section><div class="wrap">
    <h2>${esc(d.name)}最常遇到的三個問題</h2>
    <div class="pains">${d.pains.map(p=>`<article><h3>${esc(p[0])}</h3><p>${esc(p[1])}</p></article>`).join('')}</div>
  </div></section>

  <section class="arch-sec" id="arch"><div class="wrap">
    <h2>系統架構：從現場設備到雲端，再回到現場</h2>
    <p class="lede">不更換既有主設備，只加裝量測與控制，資料上雲後由 AI 決定最佳運轉方式。</p>
    <div class="arch">
      <div class="layer"><span class="step">現場設備</span><h3>既有設備</h3><ul>${d.equip.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>
      <div class="layer"><span class="step">量測</span><h3>電表與感測器</h3><ul><li>智慧電表（總表＋分表）</li><li>溫濕度、水溫、壓力</li><li>電流與運轉狀態</li></ul></div>
      <div class="layer"><span class="step">傳輸與控制</span><h3>邊緣閘道器</h3><ul><li>Modbus／BACnet 串接</li><li>4G／有線網路上傳</li><li>斷網時維持本地安全運轉</li></ul></div>
      <div class="layer"><span class="step">雲端</span><h3>能源戰情室</h3><ul><li>AI 運轉最佳化</li><li>15 分鐘需量預測</li><li>LINE 預警與月報</li></ul></div>
    </div>
    <p class="loop">控制指令由雲端下達閘道器，再調整現場設備；所有調整都在您設定的舒適度紅線內，並可隨時切回手動。</p>
  </div></section>

  <section><div class="wrap">
    <h2>導入項目</h2>
    <p class="lede">依現場診斷結果挑選組合，不是每一項都要做。</p>
    <div class="scen">${d.scen.map(s=>`<article class="sc"><span class="tag">${esc(s[1])}</span><h3>${esc(s[0])}</h3><p>${esc(s[2])}</p><p class="how">${esc(s[3])}</p></article>`).join('')}</div>
  </div></section>

  <section class="dash-sec"><div class="wrap">
    <h2>導入後，您每天會看到的畫面</h2>
    <p class="lede">財務、廠務與主管各自登入，看自己需要的數字。</p>
    <div class="dash" aria-label="能源戰情室示意畫面">
      <div class="tile"><small>即時需量</small><b class="num">812 <span style="font-size:16px">kW</span></b><div class="meter"><i style="width:81%"></i></div><small style="margin-top:6px">契約容量 1,000 kW</small></div>
      <div class="tile"><small>今日用電</small><b class="num">11,460 <span style="font-size:16px">度</span></b></div>
      <div class="tile"><small>本月已節電</small><b class="num g">18.6%</b></div>
      <div class="tile tall"><small>事件紀錄</small><ul class="log"><li><time>14:15</time><span>需量逼近 92%，已調整 3F 空調箱</span></li><li><time>13:40</time><span>2 號冰水主機效率偏低，已通知工務</span></li><li><time>07:30</time><span>依天氣預報提前 20 分鐘預冷</span></li></ul></div>
      <div class="tile wide"><small>今日需量曲線（虛線為安全上限 90%）</small>${spark()}</div>
    </div>
    <p class="mock-note">示意畫面，數字非實際案場資料。</p>
  </div></section>

  <section><div class="wrap">
    <h2>適合導入 0 元方案的${esc(d.name)}</h2>
    <div class="fit">${d.fit.map(f=>`<div><small>${esc(f[1])}</small><b class="num">${esc(f[0])}</b><p>${esc(f[2])}</p></div>`).join('')}</div>
  </div></section>

  <section class="cta"><div class="wrap"><div class="cta-box">
    <div><h2>上傳電費單，48 小時取得免費診斷</h2><p>由能源工程師評估${esc(d.name)}的節費潛力與契約容量優化空間。</p></div>
    <div class="ctas"><a class="btn btn-amber" href="index.html#apply">上傳電費單，免費評估</a><a class="btn btn-line" href="index.html#calc">先試算看看</a></div>
  </div></div></section>`;
}
addEventListener('hashchange',()=>{render();scrollTo(0,0);});
render();
}
</script>
