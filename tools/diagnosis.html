<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>免費電費健檢診斷報告｜能溢有限公司</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F2942;--green:#10B981;--green-soft:#e7f8f1;--amber:#F59E0B;--bg:#F8FAFC;--ink:#334155;--muted:#64748b;--line:#e2e8f0;--red:#e2554a}
*{box-sizing:border-box;min-width:0}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.7}
.num{font-family:"Barlow Condensed","Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{color:var(--navy);margin:0;line-height:1.3}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}
.btn.amber{background:var(--amber);color:#1f1300}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}

/* ---------- 輸入區（列印時隱藏） ---------- */
.tool{background:var(--navy);color:#cbd5e1;padding:20px 0 28px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.tool h1{color:#fff;font-size:22px}
.tool p.hint{font-size:13.5px;color:#9fb2c6;margin:4px 0 16px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid{grid-template-columns:1fr 1fr}}
.tool label{display:block;font-size:13px;color:#9fb2c6;margin-bottom:4px}
.tool input,.tool select,.tool textarea{width:100%;border:1px solid #2b4d70;background:#102c48;color:#fff;border-radius:8px;padding:8px 10px;font-size:15px}
.tool textarea{height:88px;font-family:ui-monospace,monospace;font-size:12.5px}
.rowbtn{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.months{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
.months th{color:#9fb2c6;font-weight:500;text-align:left;padding:4px}
.months td{padding:3px 4px}
.months input{padding:5px 7px;font-size:14px;text-align:right}
.tblwrap{overflow-x:auto}
.msg{font-size:13.5px;margin-top:8px;color:#fde9c0}
details.rates{margin-top:14px;font-size:13.5px}
details.rates summary{cursor:pointer;color:#fff}

/* ---------- 報告（A4） ---------- */
.report{max-width:820px;margin:24px auto 60px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:44px 48px}
@media (max-width:760px){.report{padding:24px 18px;margin:12px}}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:3px solid var(--navy);padding-bottom:16px}
.rhead img{height:44px}
.rhead .meta{text-align:right;font-size:13px;color:var(--muted)}
.rtitle{margin:22px 0 4px;font-size:26px;font-weight:900}
.rsub{color:var(--muted);font-size:14px}
.sec{margin-top:30px}
.sec h2{font-size:18px;padding-left:12px;border-left:4px solid var(--green);margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--bg);border-radius:10px;padding:12px 14px}
.kpi small{display:block;font-size:12.5px;color:var(--muted)}
.kpi b{font-size:28px;color:var(--navy);font-weight:600;line-height:1.2}
.kpi b.g{color:var(--green)} .kpi b.r{color:var(--red)}
.kpi.hero{background:var(--navy)} .kpi.hero small{color:#9fb2c6} .kpi.hero b{color:#fff;font-size:24px;white-space:nowrap}
table.data{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
table.data th,table.data td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{background:var(--bg);color:var(--muted);font-weight:500}
table.data tr.over td{color:var(--red)}
table.data tfoot td{font-weight:700;background:var(--green-soft)}
.chart svg{width:100%;height:auto;display:block}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.find{display:grid;gap:10px}
.find div{border-left:3px solid var(--amber);padding:2px 0 2px 12px}
.find b{color:var(--navy)}
.plan{background:var(--green-soft);border-radius:12px;padding:18px 20px}
.plan b{color:#065f46}
.sign{margin-top:34px;display:flex;justify-content:space-between;gap:20px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}

@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;font-size:12.5px}
  .tool{display:none}
  .report{border:0;margin:0;padding:0;max-width:none;border-radius:0}
  .sec{break-inside:avoid}
  .kpi.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .plan,.kpi,table.data th,table.data tfoot td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<section class="tool" aria-label="輸入資料">
  <div class="wrap">
    <h1>免費電費健檢診斷報告產生器</h1>
    <p class="hint">輸入客戶資料與 12 個月電費資料，下方報告即時更新。完成後按「列印 / 存成 PDF」。資料只存在這台電腦的瀏覽器裡，不會上傳。</p>

    <div class="grid">
      <div><label for="iName">客戶名稱</label><input id="iName" placeholder="例如 ○○美髮"></div>
      <div><label for="iNo">台電電號</label><input id="iNo" placeholder="例如 05-44-1510-10-8"></div>
      <div><label for="iAddr">用電地址</label><input id="iAddr"></div>
      <div><label for="iDate">報告日期</label><input id="iDate" type="date"></div>
      <div><label for="iType">用電類別</label>
        <select id="iType">
          <option value="lv">低壓需量（未滿 100 瓩）</option>
          <option value="hv">高壓</option>
          <option value="ehv">特高壓</option>
        </select></div>
      <div><label for="iInd">產業</label>
        <select id="iInd">
          <option value="0.45">美容美髮・零售門市</option>
          <option value="0.50">餐飲</option>
          <option value="0.50">商辦大樓</option>
          <option value="0.45">飯店旅宿</option>
          <option value="0.45">醫院診所・長照</option>
          <option value="0.35">製造工廠</option>
          <option value="0.50">冷鏈倉儲・量販</option>
          <option value="0.40">其他</option>
        </select></div>
      <div><label for="iEng">評估工程師</label><input id="iEng" placeholder="姓名"></div>
      <div><label for="iTarget">客群</label>
        <select id="iTarget"><option value="small">小用戶（契約容量・電價調整）</option><option value="big">大用戶（0 元 ESCO）</option></select></div>
    </div>

    <label for="iPaste" style="margin-top:14px">或貼上資料：從「表五之二 電能使用量統計表」或 Excel 複製 1～12 月的列，直接貼上</label>
    <textarea id="iPaste" placeholder="1月	1724	0	0	0	0	0	1512	1480	1520	…"></textarea>
    <div class="rowbtn">
      <label class="btn amber" for="iFile" style="display:inline-block;margin:0;color:#1f1300">匯入台電 G004 檔案</label>
      <input type="file" id="iFile" accept=".xls,.htm,.html" style="position:absolute;width:1px;height:1px;opacity:0">
      <button class="btn ghost" id="bParse">讀取貼上的資料</button>
      <button class="btn ghost" id="bDemo">載入範例資料</button>
      <button class="btn ghost" id="bClear">清空</button>
      <button class="btn" id="bPrint" style="margin-left:auto">列印 / 存成 PDF</button>
    </div>
    <p class="msg" id="msg" role="status"></p>

    <div class="tblwrap">
    <table class="months" aria-label="12 個月電費資料">
      <thead><tr><th>帳單月份</th><th>經常契約（瓩）</th><th>最高需量（瓩）</th><th>用電度數（度）</th><th>總電費（元）</th></tr></thead>
      <tbody id="mBody"></tbody>
    </table>
    </div>

    <details class="rates">
      <summary>費率與假設（台電經常契約基本電費，可修改）</summary>
      <div class="grid" style="margin-top:10px">
        <div><label for="rSum">夏月 元/瓩・月</label><input id="rSum" type="number" step="0.1"></div>
        <div><label for="rNon">非夏月 元/瓩・月</label><input id="rNon" type="number" step="0.1"></div>
        <div><label for="rP1">超約 10% 以內倍數</label><input id="rP1" type="number" step="0.5" value="2"></div>
        <div><label for="rP2">超約 10% 以上倍數</label><input id="rP2" type="number" step="0.5" value="3"></div>
        <div><label for="rAcLo">空調節能率下限 %</label><input id="rAcLo" type="number" value="15"></div>
        <div><label for="rAcHi">空調節能率上限 %</label><input id="rAcHi" type="number" value="30"></div>
        <div><label for="rShare">能溢分潤比例 %</label><input id="rShare" type="number" value="70"></div>
        <div><label for="rEf">排碳係數 kg/度</label><input id="rEf" type="number" step="0.001" value="0.474"></div>
      </div>
      <p class="hint" style="margin-top:8px">預設費率：低壓 236.20／173.20、高壓 223.60／166.90、特高壓 217.30／160.60 元/瓩・月。夏月：低壓 6～9 月；高壓、特高壓 5/16～10/15（5、10 月帳單以一半計）。台電調整費率時請更新。</p>
    </details>
  </div>
</section>

<article class="report" id="report" aria-label="診斷報告"></article>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,d=0)=>isFinite(x)?Number(x).toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const RATES={lv:[236.2,173.2],hv:[223.6,166.9],ehv:[217.3,160.6]};
const TYPE_NAME={lv:'低壓需量',hv:'高壓',ehv:'特高壓'};
const KEY='nengyi-diag-v1';

/* 月份列 */
const mBody=$('mBody');
mBody.innerHTML=Array.from({length:12},(_,i)=>`<tr><td>${i+1} 月</td>
  <td><input type="number" min="0" data-m="${i}" data-k="c" aria-label="${i+1}月經常契約"></td>
  <td><input type="number" min="0" data-m="${i}" data-k="d" aria-label="${i+1}月最高需量"></td>
  <td><input type="number" min="0" data-m="${i}" data-k="kwh" aria-label="${i+1}月用電度數"></td>
  <td><input type="number" min="0" data-m="${i}" data-k="cost" aria-label="${i+1}月總電費"></td></tr>`).join('');

const fields=['iName','iNo','iAddr','iDate','iType','iInd','iEng','iTarget','rSum','rNon','rP1','rP2','rAcLo','rAcHi','rShare','rEf'];
function readMonths(){return Array.from({length:12},(_,i)=>{const g=k=>parseFloat(mBody.querySelector(`[data-m="${i}"][data-k="${k}"]`).value);return{c:g('c'),d:g('d'),kwh:g('kwh'),cost:g('cost')}})}
function writeMonths(ms){ms.forEach((m,i)=>['c','d','kwh','cost'].forEach(k=>{mBody.querySelector(`[data-m="${i}"][data-k="${k}"]`).value=isFinite(m[k])?m[k]:''}))}
function save(){try{const o={};fields.forEach(f=>o[f]=$(f).value);o.months=readMonths();localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(!o)return false;fields.forEach(f=>{if(o[f]!==undefined)$(f).value=o[f]});writeMonths(o.months||[]);return true}catch(e){return false}}
function setRates(){const r=RATES[$('iType').value];$('rSum').value=r[0];$('rNon').value=r[1]}

/* 夏月權重：低壓 6–9 月；高壓 5/16–10/15 */
function summerW(type,m){ // m = 1..12
  if(type==='lv') return (m>=6&&m<=9)?1:0;
  if(m>=6&&m<=9) return 1; if(m===5||m===10) return 0.5; return 0;
}
function basic(C,D,rate,p1,p2){ // 一個月基本電費（含超約）
  let cost=C*rate; const over=Math.max(0,D-C);
  if(over>0){const a=Math.min(over,0.1*C), b=over-a; cost+=a*rate*p1+b*rate*p2;}
  return cost;
}

/* 貼上解析：表五之二（≥17 個數字）或 4 欄（契約、需量、度數、電費） */
function parsePaste(){
  const lines=$('iPaste').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const out=Array.from({length:12},()=>({c:NaN,d:NaN,kwh:NaN,cost:NaN})); let n=0;
  for(const ln of lines){
    const mm=ln.match(/^(\d{1,2})\s*月/); if(!mm) continue;
    const m=+mm[1]; if(m<1||m>12) continue;
    const nums=ln.replace(/^(\d{1,2})\s*月/,'').split(/[\t,|]+|\s{2,}|\s/).map(s=>s.replace(/,/g,'')).filter(s=>s!=='').map(Number).filter(x=>isFinite(x));
    let r;
    if(nums.length>=17){ // 契約5、需量4、度數5、轉供1、功因1、總電費1
      r={c:nums[0],d:Math.max(nums[5],nums[6],nums[7],nums[8]),kwh:nums[13],cost:nums[nums.length-1]};
    }else if(nums.length>=4){r={c:nums[0],d:nums[1],kwh:nums[2],cost:nums[3]};}
    else continue;
    out[m-1]=r; n++;
  }
  if(!n){$('msg').textContent='沒有讀到資料：每一列要以「1月」「2月」…開頭。';return}
  writeMonths(out); $('msg').textContent=`已讀取 ${n} 個月。最高需量取尖峰、半尖峰、週六半尖峰、離峰中最大的值。`; render(); save();
}


/* 匯入台電「用戶用電歷史資料表」G004（HTML 格式的 .xls，Big5 編碼） */
async function importG004(file){
  const buf=await file.arrayBuffer();
  let html; try{html=new TextDecoder('big5').decode(buf)}catch(e){html=new TextDecoder().decode(buf)}
  if(!/G004|用電歷史資料/.test(html)) html=new TextDecoder().decode(buf);
  const doc=new DOMParser().parseFromString(html,'text/html');
  const cells=r=>[...r.cells].map(c=>c.textContent.replace(/\s+/g,' ').trim());
  const rows=[...doc.querySelectorAll('tr')].map(cells);
  const clean=t=>t.replace(/\s/g,'');
  const find=label=>{for(const r of rows){const i=r.findIndex(c=>clean(c)===label); if(i>=0){const v=r.slice(i+1).find(c=>c&&clean(c)!==label); if(v) return v;}} return '';};
  let contract=NaN;
  for(const r of rows){const i=r.findIndex(c=>clean(c)==='經常'); if(i>=0&&isFinite(parseFloat(r[i+1]))){contract=parseFloat(r[i+1]);break;}}
  const out=Array.from({length:12},()=>({c:NaN,d:NaN,kwh:NaN,cost:NaN})); let n=0;
  for(const r of rows){
    const m=(r[0]||'').match(/^(\d{4})\/(\d{1,2})$/); if(!m) continue;
    const v=r.slice(1).map(x=>parseFloat(x.replace(/,/g,'')));
    if(v.length<11) continue;
    out[+m[2]-1]={c:contract,d:Math.max(v[0]||0,v[1]||0,v[2]||0,v[3]||0),kwh:v[8],cost:v[10]}; n++;
  }
  if(!n){$('msg').textContent='這個檔案讀不到月份資料，請確認是台電 G004 用電歷史資料表。';return}
  const name=find('戶名'), no=find('電號'), addr=find('用電地址');
  if(name) $('iName').value=name; if(no) $('iNo').value=no; if(addr) $('iAddr').value=addr;
  if(isFinite(contract)){ $('iType').value=contract<100?'lv':'hv'; setRates(); }
  writeMonths(out);
  $('msg').textContent=`已匯入 ${n} 個月（經常契約 ${isFinite(contract)?contract:'未讀到'} 瓩）。最高需量取四個時段中最大的值。請確認用電類別與產業。`;
  render(); save();
}

function demo(){
  $('iName').value='範例美髮沙龍'; $('iNo').value='00-00-0000-00-0'; $('iAddr').value='新北市○○區○○路 1 號';
  $('iType').value='lv'; $('iInd').value='0.45'; $('iTarget').value='small'; setRates();
  const d=[38,36,40,45,52,63,68,70,61,50,42,39], k=[5200,4800,5400,6100,7300,9100,10200,10500,8800,6900,5600,5300];
  writeMonths(d.map((x,i)=>({c:80,d:x,kwh:k[i],cost:Math.round(80*(i>=5&&i<=8?236.2:173.2)+k[i]*(i>=5&&i<=8?3.44:3.26))})));
  $('msg').textContent='已載入範例資料（虛構）。'; render(); save();
}

function analyze(){
  const type=$('iType').value, rs=+$('rSum').value, rn=+$('rNon').value, p1=+$('rP1').value, p2=+$('rP2').value;
  const ms=readMonths().map((m,i)=>({...m,mon:i+1}));
  const valid=ms.filter(m=>isFinite(m.c)&&isFinite(m.d)&&m.c>0);
  if(valid.length<3) return null;
  const rate=m=>{const w=summerW(type,m.mon);return rs*w+rn*(1-w)};
  const curC=valid[valid.length-1].c;
  const costAt=C=>valid.reduce((s,m)=>s+basic(C,m.d,rate(m),p1,p2),0);
  const curActual=valid.reduce((s,m)=>s+basic(m.c,m.d,rate(m),p1,p2),0);
  const maxD=Math.max(...valid.map(m=>m.d));
  let best={C:curC,cost:costAt(curC)};
  const lo=Math.max(1,Math.floor(maxD*0.6)), hi=Math.ceil(Math.max(maxD*1.3,curC));
  for(let C=lo;C<=hi;C++){const c=costAt(C); if(c<best.cost-0.5) best={C,cost:c};}
  const overMonths=valid.filter(m=>m.d>m.c);
  const penalty=valid.reduce((s,m)=>s+basic(m.c,m.d,rate(m),p1,p2)-m.c*rate(m),0);
  const kwh=ms.reduce((s,m)=>s+(isFinite(m.kwh)?m.kwh:0),0), cost=ms.reduce((s,m)=>s+(isFinite(m.cost)?m.cost:0),0);
  const months=valid.length, scale=12/months;
  const share=+$('iInd').value, acLo=+$('rAcLo').value/100, acHi=+$('rAcHi').value/100;
  const price=kwh>0?cost/kwh:NaN;
  const acKwhLo=kwh*scale*share*acLo, acKwhHi=kwh*scale*share*acHi;
  const capSave=Math.max(0,(curActual-best.cost)*scale);
  return {type,ms,valid,curC,maxD,best,curActual:curActual*scale,optCost:best.cost*scale,capSave,overMonths,penalty:penalty*scale,
    kwh:kwh*scale,cost:cost*scale,price,share,acKwhLo,acKwhHi,acSaveLo:acKwhLo*price,acSaveHi:acKwhHi*price,months,
    loadFactor: kwh>0? (kwh/months)/(maxD*730):NaN};
}

function chart(a){
  const W=720,H=230,L=46,R=10,T=14,B=30, iw=W-L-R, ih=H-T-B;
  const vals=a.ms.map(m=>isFinite(m.d)?m.d:0), cs=a.ms.map(m=>isFinite(m.c)?m.c:0);
  const mx=Math.max(...vals,...cs,a.best.C)*1.12||1, bw=iw/12*0.6;
  const y=v=>T+ih*(1-v/mx);
  let s='';
  for(let k=0;k<=4;k++){const v=mx*k/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8f0"/><text x="${L-6}" y="${y(v)+4}" font-size="11" fill="#64748b" text-anchor="end">${fmt(v)}</text>`}
  a.ms.forEach((m,i)=>{const x=L+iw*(i+0.5)/12; const v=vals[i]; const over=isFinite(m.c)&&v>m.c;
    s+=`<rect x="${x-bw/2}" y="${y(v)}" width="${bw}" height="${Math.max(0,T+ih-y(v))}" rx="3" fill="${over?'#e2554a':'#0F2942'}"/>
    <text x="${x}" y="${H-10}" font-size="11" fill="#64748b" text-anchor="middle">${i+1}月</text>`});
  const pts=a.ms.map((m,i)=>`${L+iw*(i+0.5)/12},${y(cs[i])}`).join(' ');
  s+=`<polyline points="${pts}" fill="none" stroke="#F59E0B" stroke-width="2.5"/>`;
  if(a.best.C!==a.curC) s+=`<line x1="${L}" x2="${W-R}" y1="${y(a.best.C)}" y2="${y(a.best.C)}" stroke="#10B981" stroke-width="2" stroke-dasharray="6 5"/><text x="${W-R}" y="${y(a.best.C)-6}" font-size="11.5" fill="#047857" text-anchor="end">建議契約 ${fmt(a.best.C)} 瓩</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每月最高需量與契約容量">${s}</svg>
  <p class="note">深藍：每月最高需量；紅色：超過契約容量的月份；橘線：目前契約容量；綠色虛線：建議契約容量。</p>`;
}

function render(){
  const a=analyze(), r=$('report');
  const name=esc($('iName').value||'（客戶名稱）'), date=$('iDate').value||new Date().toISOString().slice(0,10);
  const head=`<div class="rhead"><img src="../assets/logo-horizontal.svg" alt="能溢有限公司"><div class="meta">報告日期 ${esc(date)}<br>能溢有限公司・統一編號 62178327<br>0975-463-123・ericworks753@gmail.com</div></div>
  <h1 class="rtitle">企業電費健檢與契約容量診斷報告</h1>
  <p class="rsub">${name}　電號 ${esc($('iNo').value||'—')}　${esc(TYPE_NAME[$('iType').value])}　${esc($('iAddr').value)}</p>`;
  if(!a){r.innerHTML=head+`<div class="sec"><p>請在上方輸入至少 3 個月的「經常契約」與「最高需量」，報告會自動產生。也可以按「載入範例資料」看看效果。</p></div>`;return}

  const shareN=+$('rShare').value/100, big=$('iTarget').value==='big';
  const totalLo=a.capSave+a.acSaveLo, totalHi=a.capSave+a.acSaveHi;
  const dir=a.best.C<a.curC?'調降':a.best.C>a.curC?'調升':'維持';
  const finds=[];
  if(a.overMonths.length) finds.push(`<div><b>有 ${a.overMonths.length} 個月超約。</b>最高需量 ${fmt(a.maxD)} 瓩，超過目前契約 ${fmt(a.curC)} 瓩，一年約多繳 <b class="num">${fmt(a.penalty)}</b> 元超約附加費。</div>`);
  if(a.best.C<a.curC) finds.push(`<div><b>契約容量訂得偏高。</b>多數月份用不到 ${fmt(a.curC)} 瓩，每個月都在為用不到的容量付基本電費。</div>`);
  if(a.best.C!==a.curC) finds.push(`<div><b>建議${dir}到 ${fmt(a.best.C)} 瓩。</b>以過去 ${a.months} 個月用電試算，一年基本電費可省約 <b class="num">${fmt(a.capSave)}</b> 元。</div>`);
  const nOverNew=a.valid.filter(m=>m.d>a.best.C).length;
  if(a.best.C!==a.curC&&nOverNew) finds.push(`<div><b>建議值會讓 ${nOverNew} 個月小幅超約，但整年仍比較省。</b>這是因為超約只在夏季幾個月發生，付少量超約費比全年多付基本電費划算；電力分析儀的需量預警可以再把超約壓低。</div>`);
  else finds.push(`<div><b>目前契約容量已接近最佳值。</b>節費重點在空調運轉與尖峰用電管理。</div>`);
  if(isFinite(a.loadFactor)&&a.loadFactor<0.3) finds.push(`<div><b>用電集中在短時間。</b>負載率約 ${fmt(a.loadFactor*100)}%，尖峰需量偏高，裝設電力分析儀監控與錯開設備啟動可以再壓低需量。</div>`);
  finds.push(`<div><b>空調是最大的可調整用電。</b>依產業估計空調約佔用電 ${fmt(a.share*100)}%，運轉最佳化可省 ${fmt(+$('rAcLo').value)}～${fmt(+$('rAcHi').value)}%。</div>`);

  const rows=a.ms.map(m=>{if(!isFinite(m.c)&&!isFinite(m.d))return '';const over=m.d>m.c;
    return `<tr class="${over?'over':''}"><td>${m.mon} 月</td><td>${fmt(m.c)}</td><td>${fmt(m.d)}</td><td>${over?'+'+fmt(m.d-m.c):'—'}</td><td>${fmt(m.kwh)}</td><td>${fmt(m.cost)}</td></tr>`}).join('');

  const planSmall=`<p><b>0 元導入，從省下的電費分潤。</b>能溢負責安裝電力分析儀、線上數據分析、向台電辦理契約容量與電價調整（相關規費由能溢支付）。合約期間每月省下的電費，客戶保留 ${fmt((1-shareN)*100)}%、能溢 ${fmt(shareN*100)}%；沒省到就不收費。</p>
  <p style="margin-top:8px">以本報告估計，每月約省 <b class="num">${fmt(totalLo/12)}～${fmt(totalHi/12)}</b> 元，客戶每月實際多留 <b class="num">${fmt(totalLo/12*(1-shareN))}～${fmt(totalHi/12*(1-shareN))}</b> 元，不需任何前期費用。</p>`;
  const planBig=`<p><b>0 元 ESCO 節能分潤。</b>能溢全額出資建置監控與空調最佳化設備，依 IPMVP 國際標準驗證節電量，只從實際省下的電費分潤（客戶 ${fmt((1-shareN)*100)}%、能溢 ${fmt(shareN*100)}%）。合約期滿設備無償移轉。</p>
  <p style="margin-top:8px">以本報告估計，每年約省 <b class="num">${fmt(totalLo)}～${fmt(totalHi)}</b> 元。精確數字需現場量測空調設備後確認。</p>`;

  r.innerHTML=head+`
  <section class="sec"><h2>診斷結果摘要</h2>
    <div class="kpis">
      <div class="kpi hero"><small>每年可省電費（估計）</small><b class="num">${fmt(totalLo)}～${fmt(totalHi)}</b><small>元</small></div>
      <div class="kpi"><small>契約容量建議</small><b class="num ${a.best.C!==a.curC?'g':''}">${fmt(a.curC)} → ${fmt(a.best.C)}</b><small>瓩，每年省 ${fmt(a.capSave)} 元</small></div>
      <div class="kpi"><small>超約月份</small><b class="num ${a.overMonths.length?'r':''}">${a.overMonths.length} 個月</b><small>超約附加費約 ${fmt(a.penalty)} 元/年</small></div>
    </div>
  </section>
  <section class="sec"><h2>主要發現</h2><div class="find">${finds.join('')}</div></section>
  <section class="sec chart"><h2>每月最高需量與契約容量</h2>${chart(a)}</section>
  <section class="sec"><h2>用電明細</h2>
    <div style="overflow-x:auto"><table class="data"><thead><tr><th>月份</th><th>經常契約（瓩）</th><th>最高需量（瓩）</th><th>超約（瓩）</th><th>用電度數</th><th>總電費（元）</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>年合計</td><td></td><td>最高 ${fmt(a.maxD)}</td><td></td><td>${fmt(a.kwh)}</td><td>${fmt(a.cost)}</td></tr></tfoot></table></div>
    <p class="note">平均電價約 ${fmt(a.price,2)} 元/度。${a.months<12?`資料只有 ${a.months} 個月，年度數字依比例推估。`:''}</p>
  </section>
  <section class="sec"><h2>節費潛力估算</h2>
    <div style="overflow-x:auto"><table class="data"><thead><tr><th>項目</th><th>作法</th><th>每年節省（元）</th><th>年節電（度）</th></tr></thead><tbody>
      <tr><td>契約容量最佳化</td><td>${dir}至 ${fmt(a.best.C)} 瓩</td><td>${fmt(a.capSave)}</td><td>—</td></tr>
      <tr><td>空調運轉最佳化</td><td>電力分析儀監控＋運轉調整</td><td>${fmt(a.acSaveLo)}～${fmt(a.acSaveHi)}</td><td>${fmt(a.acKwhLo)}～${fmt(a.acKwhHi)}</td></tr>
      <tr><td>時間電價方案</td><td>依電力分析儀 15 分鐘資料評估</td><td>裝機後評估</td><td>—</td></tr>
    </tbody><tfoot><tr><td>合計</td><td></td><td>${fmt(totalLo)}～${fmt(totalHi)}</td><td>${fmt(a.acKwhLo)}～${fmt(a.acKwhHi)}</td></tr></tfoot></table></div>
    <p class="note">年減碳約 ${fmt(a.acKwhLo*+$('rEf').value/1000,1)}～${fmt(a.acKwhHi*+$('rEf').value/1000,1)} 公噸 CO₂e。契約容量試算依台電經常契約基本電費與超約附加費規定（超約 10% 以內 ${$('rP1').value} 倍、超過部分 ${$('rP2').value} 倍）；實際調整前會再確認未來用電計畫與台電規定。</p>
  </section>
  <section class="sec"><h2>能溢建議方案</h2><div class="plan">${big?planBig:planSmall}</div></section>
  <section class="sec"><h2>下一步</h2>
    <div class="find">
      <div><b>1. 確認報告內容</b>：有任何設備變動或營業時間調整，請告訴我們，我們會修正估算。</div>
      <div><b>2. 簽約與安裝</b>：簽約後約 1～2 週安裝電力分析儀，同步向台電申請契約調整。</div>
      <div><b>3. 每月績效報表</b>：每月寄送節電績效表，以台電電費單核對，沒省到不收費。</div>
    </div>
  </section>
  <div class="sign"><span>評估工程師：${esc($('iEng').value||'＿＿＿＿＿＿')}</span><span>本報告為依電費資料之初步估算，實際效益以現場量測與台電帳單為準。</span></div>`;
}

/* 事件 */
document.querySelector('.tool').addEventListener('input',e=>{ if(e.target.id==='iType') setRates(); render(); save(); });
$('bParse').onclick=parsePaste; $('iFile').onchange=e=>{const f=e.target.files[0]; if(f) importG004(f); e.target.value='';}; $('bDemo').onclick=demo;
$('bClear').onclick=()=>{ if(!confirmClear()) return; fields.forEach(f=>{if(f.startsWith('i'))$(f).value=''}); $('iType').value='lv';$('iInd').value='0.45';$('iTarget').value='small'; setRates(); writeMonths([]); $('iPaste').value=''; $('msg').textContent='已清空。'; render(); save(); };
let armed=false; function confirmClear(){ if(armed){armed=false;$('bClear').textContent='清空';return true} armed=true; $('bClear').textContent='再按一次確認清空'; setTimeout(()=>{armed=false;$('bClear').textContent='清空'},3000); return false; }
$('bPrint').onclick=()=>{ try{window.print()}catch(e){$('msg').textContent='這個預覽視窗不能列印，請用瀏覽器直接開啟這個檔案。'} };

if(!load()){ setRates(); $('iDate').value=new Date().toISOString().slice(0,10); }
render();
}
</script>
</body>
</html>
